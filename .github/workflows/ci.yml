name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f # v1.22
      - name: Show MoonBit toolchain
        run: moon version --all
      - run: moon check --target all --deny-warn
      - run: moon build --target all --release --deny-warn
      - run: moon test --target all --deny-warn
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run build
      - run: npm test
