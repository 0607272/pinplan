<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PinPlan · Pico 接线规划</title>
  <style>
    :root { color-scheme: dark; --bg:#09131f; --panel:#112235; --muted:#98acc1; --text:#ecf5ff; --blue:#5dd7ff; --red:#ff7d8c; --green:#72e6ad; }
    * { box-sizing:border-box } body { margin:0; background:linear-gradient(135deg,#08111c,#10263a); color:var(--text); font:15px/1.5 system-ui,sans-serif }
    main { max-width:1180px; margin:auto; padding:34px 22px 60px } header { display:flex; justify-content:space-between; gap:24px; align-items:end; margin-bottom:24px }
    h1 { font-size:clamp(30px,5vw,56px); line-height:1; margin:0 0 10px } h2 { margin:0 0 12px } .lede { color:var(--muted); max-width:680px }
    .grid { display:grid; grid-template-columns:minmax(360px,1fr) minmax(340px,1fr); gap:18px } .panel { background:rgba(17,34,53,.9); border:1px solid #23415e; border-radius:18px; padding:18px; box-shadow:0 12px 38px #0004 }
    textarea { width:100%; min-height:355px; resize:vertical; padding:14px; background:#07111b; color:#d9efff; border:1px solid #2d5778; border-radius:12px; font:13px ui-monospace,monospace }
    button,select { color:var(--text); background:#1a4b70; border:1px solid #347ba8; border-radius:9px; padding:9px 12px; cursor:pointer } button:hover { background:#286d98 }
    .toolbar { display:flex; gap:9px; flex-wrap:wrap; margin:11px 0 } .status { display:inline-flex; padding:4px 9px; border-radius:99px; font-weight:700 } .solved { background:#164f3c;color:var(--green) } .invalid,.unsatisfiable { background:#5b2431;color:#ffb4bd } .limit { background:#5b471d;color:#ffd77a }
    #summary { color:var(--muted); min-height:24px } .finding { border-left:4px solid var(--red); padding:9px 12px; background:#351d2a; border-radius:8px; margin:8px 0 } .finding code { color:#ffcf83 }
    table { border-collapse:collapse; width:100%; font-size:13px } th,td { text-align:left; border-bottom:1px solid #24415a; padding:8px } th { color:var(--muted) }
    .board-wrap { overflow:auto; background:#07111b; border-radius:12px; padding:12px } svg { min-width:500px; width:100%; height:270px } .pin { fill:#183b56; stroke:#69cfff; stroke-width:1.3 } .pin.used { fill:#1e775e; stroke:#a6ffe0 } .pin.bad { fill:#8b3442; stroke:#ffc1c8 } .pin text { fill:#effaff; font:10px ui-monospace,monospace; text-anchor:middle }
    .small { color:var(--muted); font-size:12px } @media (max-width:800px) { header { display:block } .grid { grid-template-columns:1fr } }
  </style>
</head>
<body><main>
  <header><div><h1>PinPlan</h1><div class="lede">接线之前，先检查 Raspberry Pi Pico 的外设引脚与共享资源。MoonBit 负责约束检查和确定性搜索。</div></div><div><span id="status" class="status solved">等待输入</span></div></header>
  <div class="grid"><section class="panel"><h2>输入配置</h2><div class="toolbar"><select id="preset"><option value="mixed">混合外设</option><option value="shared-i2c">共享 I²C</option><option value="repair">固定电机并规划指示灯</option><option value="pwm-conflict">PWM 冲突</option><option value="limit">搜索预算为 0</option></select><button id="plan">规划</button><button id="check">检查当前接线</button></div><textarea id="input" spellcheck="false"></textarea><p class="small">字段：board=pico，kind 为 uart/spi/i2c/pwm；plan 可部分锁定 pins，check 要求完整 pins。</p></section>
    <section class="panel"><h2>结果</h2><div id="summary"></div><div id="findings"></div><div id="assignments"></div><h2 style="margin-top:18px">Pico 引脚图</h2><div class="board-wrap"><svg id="board" viewBox="0 0 720 260" role="img" aria-label="Pico GPIO allocation"></svg></div></section></div>
</main><script type="module">
import { run_json } from './pinplan.js';
const presets = {
  mixed: { board:'pico', devices:[{id:'console',kind:'uart',pins:{TX:0,RX:1}},{id:'sensor',kind:'i2c',pins:{SDA:4,SCL:5}},{id:'display',kind:'spi'},{id:'motor',kind:'pwm',pins:{OUT:2},frequency_hz:1000}] },
  'shared-i2c': { board:'pico', devices:[{id:'temperature',kind:'i2c',bus:'sensors',frequency_hz:100000},{id:'humidity',kind:'i2c',bus:'sensors',frequency_hz:100000},{id:'console',kind:'uart',pins:{TX:0,RX:1}}] },
  repair: { board:'pico', devices:[{id:'motor',kind:'pwm',pins:{OUT:0},frequency_hz:1000},{id:'indicator',kind:'pwm',frequency_hz:1000}] },
  'pwm-conflict': { mode:'check', devices:[{id:'motor',kind:'pwm',pins:{OUT:0},frequency_hz:1000},{id:'indicator',kind:'pwm',pins:{OUT:16},frequency_hz:1000}] },
  limit: { max_nodes:0, devices:[{id:'console',kind:'uart'}] },
};
const $ = id => document.getElementById(id); const input = $('input');
const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function loadPreset() { input.value = JSON.stringify(presets[$('preset').value], null, 2); run('plan'); }
function run(mode) { let value; try { value=JSON.parse(input.value); } catch { value=input.value; } if (mode==='check' && value && typeof value==='object') value.mode='check'; const r=JSON.parse(run_json(typeof value==='string'?value:JSON.stringify(value))); render(r); }
function render(r) { const status=$('status'); status.textContent=r.status; status.className=`status ${r.status}`; $('summary').textContent=`${r.assignments.length} 个设备 · ${r.nodes} 个候选尝试 · ${r.mode}`; $('findings').innerHTML=r.findings.map(f=>`<div class="finding"><code>${esc(f.code)}</code> ${esc(f.message)}</div>`).join(''); $('assignments').innerHTML=r.assignments.length?`<table><thead><tr><th>设备</th><th>类型/实例</th><th>信号引脚</th><th>总线</th></tr></thead><tbody>${r.assignments.map(a=>`<tr><td>${esc(a.id)}</td><td>${esc(a.kind)}${esc(a.instance)}</td><td>${Object.entries(a.pins).map(([k,v])=>`${esc(k)}=GPIO${esc(v)}`).join(' · ')}</td><td>${esc(a.bus??'独占/未声明')}</td></tr>`).join('')}</tbody></table>`:'<p class="small">没有可提交的完整分配。</p>'; draw(r); }
function draw(r) { const used=new Map(); for(const a of r.assignments) for(const [s,p] of Object.entries(a.pins)) used.set(p,a.id); $('board').innerHTML=`<rect x="250" y="18" width="220" height="224" rx="22" fill="#17334a" stroke="#6daed1" stroke-width="2"/><text x="360" y="132" fill="#dff6ff" text-anchor="middle" font-size="22">PICO</text>${Array.from({length:29},(_,p)=>{if(!((p<=22)||(p>=26&&p<=28)))return '';const x=p%2?500:220,y=29+Math.floor(p/2)*15;const cls=used.has(p)?'pin used':'pin';return `<g class="${cls}"><circle cx="${x}" cy="${y}" r="6"/><text x="${x+(p%2?18:-18)}" y="${y+4}">GPIO${p}</text></g>`}).join('')}`; }
$('preset').addEventListener('change',loadPreset); $('plan').addEventListener('click',()=>run('plan')); $('check').addEventListener('click',()=>run('check')); loadPreset();
</script></body></html>
