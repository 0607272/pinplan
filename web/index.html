<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PinPlan · Pico 接线规划</title>
  <style>
    :root { color-scheme: dark; --bg:#09131f; --panel:#112235; --muted:#98acc1; --text:#ecf5ff; --blue:#5dd7ff; --red:#ff7d8c; --green:#72e6ad; }
    * { box-sizing:border-box } body { margin:0; background:linear-gradient(135deg,#08111c,#10263a); color:var(--text); font:15px/1.5 system-ui,sans-serif }
    main { max-width:1180px; margin:auto; padding:34px 22px 60px } header { display:flex; justify-content:space-between; gap:24px; align-items:end; margin-bottom:24px }
    h1 { font-size:clamp(30px,5vw,56px); line-height:1; margin:0 0 10px } h2 { margin:0 0 12px } .lede { color:var(--muted); max-width:680px }
    .grid { display:grid; grid-template-columns:minmax(360px,1fr) minmax(340px,1fr); gap:18px } .panel { background:rgba(17,34,53,.9); border:1px solid #23415e; border-radius:18px; padding:18px; box-shadow:0 12px 38px #0004 }
    textarea { width:100%; min-height:355px; resize:vertical; padding:14px; background:#07111b; color:#d9efff; border:1px solid #2d5778; border-radius:12px; font:13px ui-monospace,monospace }
    button,select { color:var(--text); background:#1a4b70; border:1px solid #347ba8; border-radius:9px; padding:9px 12px; cursor:pointer } button:hover { background:#286d98 }
    .toolbar { display:flex; gap:9px; flex-wrap:wrap; margin:11px 0 } .status { display:inline-flex; padding:4px 9px; border-radius:99px; font-weight:700 } .solved { background:#164f3c;color:var(--green) } .invalid,.unsatisfiable { background:#5b2431;color:#ffb4bd } .limit { background:#5b471d;color:#ffd77a }
    #summary { color:var(--muted); min-height:24px } .finding { border-left:4px solid var(--red); padding:9px 12px; background:#351d2a; border-radius:8px; margin:8px 0 } .finding code { color:#ffcf83 }
    table { border-collapse:collapse; width:100%; font-size:13px } th,td { text-align:left; border-bottom:1px solid #24415a; padding:8px } th { color:var(--muted) }
    .board-wrap { overflow:auto; background:#07111b; border-radius:12px; padding:12px } svg { min-width:500px; width:100%; height:420px } .pin { fill:#183b56; stroke:#69cfff; stroke-width:1.3 } .pin.used { fill:#1e775e; stroke:#a6ffe0 } .pin text { fill:#effaff; font:11px ui-monospace,monospace; stroke:none } pre { white-space:pre-wrap; overflow-wrap:anywhere; font:12px ui-monospace,monospace } button:disabled { opacity:.45; cursor:default }
    .small { color:var(--muted); font-size:12px } @media (max-width:800px) { header { display:block } .grid { grid-template-columns:1fr } }
  </style>
</head>
<body><main>
  <header><div><h1>PinPlan</h1><div class="lede">检查现有接线，寻找最少改线方案，定位无法共存的设备，并核对 Pico 实体排针。核心计算由 MoonBit 完成。</div></div><div><span id="status" class="status solved">等待输入</span></div></header>
  <div class="grid"><section class="panel"><h2>输入配置</h2><div class="toolbar"><select id="preset"><option value="rewire-pwm">PWM 别名：锁住电机，移动指示灯</option><option value="rewire-frequency">频率冲突：优化改线数量</option><option value="diagnose-uart">整体无解：三个 UART</option><option value="shared-wiring">共享 I²C 接线清单</option><option value="mixed">混合外设规划</option><option value="pwm-conflict">PWM 冲突检查</option><option value="limit">搜索预算为 0</option></select><button id="run">运行配置</button><button id="check">检查现有接线</button><button id="repair">最少改线</button><button id="diagnose">诊断无解</button></div><textarea id="input" spellcheck="false"></textarea><p class="small">repair 中 baseline 是旧接线软偏好，devices.pins 是必须保留的硬锁。检查按钮在有 baseline 时检查旧接线；修复需提供完整 baseline。无解诊断检查 devices 中的硬约束。</p><details><summary>完整结果 JSON</summary><pre id="json"></pre></details><button id="download" disabled>下载结果 JSON</button></section>
    <section class="panel"><h2>结果</h2><div id="summary"></div><div id="workflow"></div><div id="findings"></div><div id="assignments"></div><h2 style="margin-top:18px">实体排针接线清单</h2><div id="wiring"></div><p class="small">排针编号按原版 Pico，USB 朝上、元件面朝向你。这里只导出信号端点；供电、接地和电气兼容性需另行核对。</p><div class="board-wrap"><svg id="board" viewBox="0 0 720 470" role="img" aria-label="Pico physical header allocation"></svg></div></section></div>
</main><script type="module">
import { run_json } from './pinplan.js';
const presets = {
  mixed: { board:'pico', devices:[{id:'console',kind:'uart',pins:{TX:0,RX:1}},{id:'sensor',kind:'i2c',pins:{SDA:4,SCL:5}},{id:'display',kind:'spi'},{id:'motor',kind:'pwm',pins:{OUT:2},frequency_hz:1000}] },
  'rewire-pwm': { mode:'repair', devices:[{id:'motor',kind:'pwm',pins:{OUT:0}},{id:'indicator',kind:'pwm'}], baseline:[{id:'motor',kind:'pwm',pins:{OUT:0}},{id:'indicator',kind:'pwm',pins:{OUT:16}}] },
  'rewire-frequency': { mode:'repair', devices:[{id:'indicator',kind:'pwm',frequency_hz:1000},{id:'servo_a',kind:'pwm',frequency_hz:50},{id:'servo_b',kind:'pwm',frequency_hz:50}], baseline:[{id:'indicator',kind:'pwm',pins:{OUT:0},frequency_hz:1000},{id:'servo_a',kind:'pwm',pins:{OUT:1},frequency_hz:50},{id:'servo_b',kind:'pwm',pins:{OUT:0},frequency_hz:50}] },
  'diagnose-uart': { mode:'diagnose', devices:[{id:'console',kind:'uart'},{id:'gps',kind:'uart'},{id:'modem',kind:'uart'},{id:'sensor',kind:'i2c',pins:{SDA:26,SCL:27}}] },
  'shared-wiring': { mode:'check', devices:[{id:'temperature',kind:'i2c',bus:'sensors',pins:{SDA:4,SCL:5},frequency_hz:100000},{id:'humidity',kind:'i2c',bus:'sensors',pins:{SDA:4,SCL:5},frequency_hz:100000},{id:'console',kind:'uart',pins:{TX:16,RX:17}}] },
  'pwm-conflict': { mode:'check', devices:[{id:'motor',kind:'pwm',pins:{OUT:0},frequency_hz:1000},{id:'indicator',kind:'pwm',pins:{OUT:16},frequency_hz:1000}] },
  limit: { max_nodes:0, devices:[{id:'console',kind:'uart'}] },
};
const $ = id => document.getElementById(id); const input = $('input');
const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
let latest;
function loadPreset() { input.value = JSON.stringify(presets[$('preset').value], null, 2); run(); }
function run(mode) {
  let value; try { value=JSON.parse(input.value); } catch { value=input.value; }
  if (mode && value && typeof value==='object' && !Array.isArray(value)) {
    value.mode=mode;
    if (mode==='check' && Array.isArray(value.baseline)) value.devices=value.baseline;
    if (mode!=='repair') delete value.baseline;
  }
  const r=JSON.parse(run_json(typeof value==='string'?value:JSON.stringify(value))); render(r);
}
function render(r) {
  latest=r; $('json').textContent=JSON.stringify(r,null,2); $('download').disabled=false;
  const status=$('status'); status.textContent=r.status; status.className=`status ${r.status}`;
  $('summary').textContent=`${r.assignments.length} 个设备 · ${r.nodes} 个候选尝试 · ${r.mode}`;
  const workflow=$('workflow'); workflow.replaceChildren();
  if (r.repair) {
    const p=document.createElement('p'); p.textContent=r.repair.changed_pins===null?'尚无可行修复':`改动 ${r.repair.changed_pins} 个设备信号端点 · ${r.repair.optimal?'已证明最少':'已找到可行方案，尚未证明最少'}`; workflow.append(p);
    for (const c of r.repair.changes) { const p=document.createElement('p'); p.textContent=`${c.device}.${c.signal}: GPIO${c.from_gpio} → GPIO${c.to_gpio}`; workflow.append(p); }
  }
  if (r.diagnosis) { const p=document.createElement('p'); p.textContent=r.diagnosis.core_devices.length?`无解设备集合：${r.diagnosis.core_devices.join('、')}。${r.diagnosis.irreducible?'移除任一设备即可有解；并非保证设备数最少。':'尚未证明不可继续缩减。'}`:'没有已证明的无解设备集合。'; workflow.append(p); }
  $('findings').innerHTML=r.findings.map(f=>`<div class="finding"><code>${esc(f.code)}</code> ${esc(f.message)}<div class="small">${esc(f.devices.join('、'))} · ${esc(f.resource)}</div></div>`).join('');
  $('assignments').innerHTML=r.assignments.length?`<table><thead><tr><th>设备</th><th>类型/实例</th><th>信号引脚</th></tr></thead><tbody>${r.assignments.map(a=>`<tr><td>${esc(a.id)}</td><td>${esc(a.kind)}${esc(a.instance)}</td><td>${Object.entries(a.pins).map(([k,v])=>`${esc(k)}=GPIO${esc(v)}`).join(' · ')}</td></tr>`).join('')}</tbody></table>`:'';
  $('wiring').innerHTML=r.wiring?.length?`<table><thead><tr><th>设备.信号</th><th>GPIO</th><th>排针号</th><th>资源 / 总线</th></tr></thead><tbody>${r.wiring.map(w=>`<tr><td>${esc(w.device)}.${esc(w.signal)}</td><td>${esc(w.gpio)}</td><td>${esc(w.header_pin)}</td><td>${esc(w.resource)} ${esc(w.bus??'')}</td></tr>`).join('')}</tbody></table>`:'<p class="small">只有通过检查的完整方案才生成接线清单。</p>';
  draw(r);
}
function draw(r) {
  const used=new Set((r.wiring??[]).map(w=>w.header_pin));
  const labels=['GP0','GP1','GND','GP2','GP3','GP4','GP5','GND','GP6','GP7','GP8','GP9','GND','GP10','GP11','GP12','GP13','GND','GP14','GP15','GP16','GP17','GND','GP18','GP19','GP20','GP21','GND','GP22','RUN','GP26','GP27','AGND','GP28','ADC_VREF','3V3_OUT','3V3_EN','GND','VSYS','VBUS'];
  $('board').innerHTML=`<rect x="250" y="22" width="220" height="424" rx="18" fill="#17334a" stroke="#6daed1" stroke-width="2"/><text x="360" y="50" fill="#dff6ff" text-anchor="middle">USB ↑</text><text x="360" y="238" fill="#dff6ff" text-anchor="middle" font-size="22">PICO</text>${labels.map((label,i)=>{const p=i+1,left=p<=20,x=left?240:480,y=40+(left?p-1:40-p)*20;return `<g class="pin${used.has(p)?' used':''}"><circle cx="${x}" cy="${y}" r="6"/><text x="${left?220:500}" y="${y+4}" text-anchor="${left?'end':'start'}">${p} · ${label}</text></g>`}).join('')}`;
}
$('download').addEventListener('click',()=>{if(!latest)return;const url=URL.createObjectURL(new Blob([JSON.stringify(latest,null,2)+'\n'],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='pinplan-result.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
$('preset').addEventListener('change',loadPreset); $('run').addEventListener('click',()=>run());
for (const mode of ['check','repair','diagnose']) $(mode).addEventListener('click',()=>run(mode));
loadPreset();
</script></body></html>
